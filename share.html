<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Peron</title>
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#F2F4F7;--card:#fff;--ink:#14213D;--muted:#5E6E85;--line:#DDE3EA;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E1626;--card:#172238;--ink:#E8EDF4;--muted:#95A4B9;--line:#283851;color-scheme:dark}.leaflet-tile-pane{filter:brightness(.68) invert(1) contrast(.88) hue-rotate(200deg) saturate(.35)}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:16px/1.4 "Atkinson Hyperlegible",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
#map{position:fixed;inset:0}
.card{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:500;background:var(--card);border-radius:18px;padding:16px;box-shadow:0 6px 24px rgba(20,33,61,.2)}
.card h1{font-size:20px;margin:0 0 4px}.eta{font-size:34px;font-weight:700;line-height:1.1}.muted{color:var(--muted);font-size:14px}
.badge{display:inline-block;border-radius:7px;padding:2px 8px;font-weight:700;font-size:14px;color:#fff}
.me{width:22px;height:22px;border-radius:50%;background:#3B82C4;border:3px solid #fff;box-shadow:0 0 0 7px rgba(59,130,196,.25)}
.me.est{background:#fff;border-color:#3B82C4}
.end{width:22px;height:22px;border-radius:50%;background:#C9362B;border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.foot{font-size:11px;color:var(--muted);margin-top:8px}.foot a{color:inherit}
</style>
</head>
<body>
<div id="map"></div>
<div class="card" id="card"><div class="muted">...</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<script src="share.js"></script>
</body>
</html>
