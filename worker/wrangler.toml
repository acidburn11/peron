name = "peron-push"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
ALLOWED_ORIGINS = "https://acidburn11.github.io"
VAPID_SUBJECT = "https://github.com/acidburn11/peron"

[[durable_objects.bindings]]
name = "DEVICE"
class_name = "Device"

[[durable_objects.bindings]]
name = "SHARE"
class_name = "Share"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Device"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Share"]
