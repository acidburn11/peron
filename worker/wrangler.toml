name = "peron-push"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
ALLOWED_ORIGINS = "https://acidburn11.github.io"
VAPID_SUBJECT = "https://github.com/acidburn11/peron"

[[durable_objects.bindings]]
name = "DEVICE"
class_name = "Device"

[[durable_objects.bindings]]
name = "SHARE"
class_name = "Share"

[[durable_objects.bindings]]
name = "BACKUP"
class_name = "Backup"

[[durable_objects.bindings]]
name = "LOG"
class_name = "Log"

[[durable_objects.bindings]]
name = "VISITS"
class_name = "Visits"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Device"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Share"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Backup"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Log"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["Visits"]
