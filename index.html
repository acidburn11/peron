<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Peron">
<title>Peron</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<div class="top" id="top">
  <button class="pill" id="openSearch"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg><span data-i18n="whereTo">Unde mergi?</span></button>
  <button class="round wx" id="wx" hidden></button>
  <button class="round" id="openOpts" data-i18n-al="options" aria-label="Optiuni"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
</div>

<div class="offline" id="offline" hidden></div>
<div class="livebar" id="livebar" hidden></div>

<button class="fab" id="recenter" data-i18n-al="recenter" aria-label="Centreaza pe locatia mea"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg></button>

<section class="sheet" id="sheet">
  <div class="grab" id="grab"><span></span></div>
  <div class="pane" id="pane"></div>
</section>

<div class="overlay" id="search" hidden>
  <div class="shd">
    <button class="icb" id="closeSearch" data-i18n-al="close" aria-label="Inchide"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="fields">
      <label class="f" id="fFromWrap"><span class="dot o"></span><input id="fFrom" data-i18n-ph="fromPh" placeholder="Punct de plecare" autocomplete="off"></label>
      <label class="f" id="fToWrap"><span class="dot d"></span><input id="fTo" data-i18n-ph="toPh" placeholder="Destinatie" autocomplete="off"></label>
    </div>
    <button class="icb" id="swap" data-i18n-al="swap" aria-label="Inverseaza"><svg viewBox="0 0 24 24"><path d="M8 4v15M4 15l4 4 4-4M16 20V5M12 9l4-4 4 4"/></svg></button>
  </div>
  <ul class="list" id="sugg"></ul>
</div>

<div class="overlay" id="opts" hidden></div>

<div class="pick" id="pick" hidden>
  <div class="pin"><svg viewBox="0 0 24 24"><path d="M12 22s7-7.2 7-12.5A7 7 0 0 0 5 9.5C5 14.8 12 22 12 22z"/><circle cx="12" cy="9.5" r="2.5"/></svg></div>
  <div class="pickbar"><span data-i18n="pickHint">Muta harta pe locul dorit</span><div><button class="btn ghost" id="pickNo" data-i18n="cancel">Renunta</button><button class="btn" id="pickOk" data-i18n="pickOk">Alege locul</button></div></div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
